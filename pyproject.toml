[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "topicdrift"
version = "0.1.0"
description = "Topic-drift analysis of long-running software-engineering conferences."
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pyyaml>=6.0",
    "requests>=2.32",
    "lxml>=5.2",
    "bertopic>=0.16",
    "scikit-learn>=1.4",
    "hdbscan>=0.8.36",
    "umap-learn>=0.5.5",
    "sentence-transformers>=2.7",
    "nltk>=3.8",
    "transformers>=4.40",
    "torch>=2.2",
    "plotly>=5.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["."]
include = ["topicdrift*"]

[tool.ruff]
line-length = 100
target-version = "py311"
